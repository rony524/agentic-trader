[project]
name = "trader"
version = "0.1.0"
description = "Agentic Trader — AI research agent for chips, energy & supply chains"
requires-python = ">=3.12,<3.16"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "yfinance>=0.2.40",
    "feedparser>=6.0",
    "networkx>=3.0",
    "httpx>=0.27",
    "ruamel.yaml>=0.18",
    "webauthn>=2.2",  # passkey approvals (no wallet needed)
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21"]
alpaca = ["alpaca-py>=0.21"]
eth = ["eth-account>=0.11", "web3>=6.0"]
postgres = ["psycopg[binary]>=3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
