# Backend only. The web app (apps/web) deploys to Vercel with NEXT_PUBLIC_API_URL set to this service's URL.
services:
  - type: web
    name: agentic-trader-api
    runtime: docker
    dockerfilePath: ./services/trader/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: ALPACA_PAPER
        value: "true"
      - key: ALPACA_API_KEY_ID
        sync: false
      - key: ALPACA_API_SECRET_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APPROVER_ADDRESSES
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: AGENT_ENABLED
        value: "true"
      - key: TRADING_FROZEN
        value: "false"
    healthCheckPath: /healthz
