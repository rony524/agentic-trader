services:
  trader-api:
    type: web
    name: agentic-trader-api
    env: docker
    dockerfilePath: ./services/trader/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ALPACA_PAPER
        value: "true"
      - key: WEB_ORIGIN
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: AGENT_ENABLED
        value: "true"
      - key: TRADING_FROZEN
        value: "false"
    healthCheckPath: /healthz

  trader-web:
    type: web
    name: agentic-trader-web
    runtime: static
    staticPublishPath: apps/web/.next
    buildCommand: cd apps/web && npm install && npm run build
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
